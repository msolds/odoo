services:
  db:
    container_name: postgres
    image: postgres:16
    volumes:
      # Volumen nombrado para la base de datos
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    ports:
      - "5432:5432"

  odoo:
    container_name: odoo
    image: odoo:19
    ports:
      - "8069:8069"
    depends_on:
      - db
    volumes:
      # Volumen nombrado para los datos de Odoo (sesiones, adjuntos, filestore) gestionado por Docker
      - odoo_data:/var/lib/odoo
      
      # Volumen local para tus módulos personalizados 
      - ./odoo/custom_addons:/mnt/extra-addons
          
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - POSTGRES_DB=postgres

# Declaración de los volúmenes nombrados
volumes:
  postgres_data:
  odoo_data:
